[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strokepointpp"
version = "0.1.0.dev0"
description = "Research-only cerebral-vessel anatomical labeling: frozen gate, 3D and fusion comparators"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = ["numpy>=1.26.4,<3", "scipy>=1.10.1,<2", "scikit-learn>=1.7.2,<2", "torch>=2.9,<3", "dynamic-network-architectures==0.4.2", "nibabel>=5.3,<6"]
test = ["pytest>=8"]

[project.scripts]
strokepointpp = "strokepointpp.cli:main"

[tool.setuptools.packages.find]
include = ["strokepointpp*"]

[tool.setuptools.package-data]
strokepointpp = ["resources/*.json"]
